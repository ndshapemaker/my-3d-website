<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ND Engineering</title>
    <link rel="stylesheet" href="style.css">

    <!-- model-viewer library -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>
    <!-- Top image -->
    <img src="models/header-image.png" alt="Site logo or header" class="top-image">

    <h1>Welcome to ND Engineering</h1>

    <!-- 3D Viewer -->
    <model-viewer src="models/mymodel.glb" alt="A 3D model" auto-rotate camera-controls background-color="#ffffff"
        style="width: 600px; height: 400px;">
    </model-viewer>

    <p>This is a simple 3D viewer of a reinforced concrete beam.</p>

    <p>Sample drawings:</p>

    <!-- Separate download buttons -->
    <div class="button-container">
        <button onclick="downloadFile('models/fasadritning-2025-10-28.pdf')">Download Fasadritning</button>
        <button onclick="downloadFile('models/plan-&-sektionsritning2025-10-28.pdf')">Download Plan &
            Sektionsritning</button>
    </div>

    <script>
        function downloadFile(filePath) {
            const link = document.createElement("a");
            link.href = filePath;
            link.download = filePath.split("/").pop();
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>

</html>
