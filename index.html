<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ND Engineering</title>
    <link rel="stylesheet" href="style.css">

    <!-- model-viewer library -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>
    <h1>Welcome to ND Engineering</h1>

    <!-- 3D Viewer -->
    <model-viewer src="models/mymodel.glb" alt="A 3D model" auto-rotate camera-controls background-color="#ffffff"
        style="width: 600px; height: 400px;">
    </model-viewer>

    <p>3D viewer for a static reinforced concrete beam.</p>

    <!-- Download button -->
    <button id="download-btn">Download Drawings PDFs</button>

    <script>
        document.getElementById("download-btn").addEventListener("click", () => {
            const files = ["models/file1.pdf", "models/file2.pdf"];

            files.forEach(file => {
                const link = document.createElement("a");
                link.href = file;
                link.download = file.split("/").pop(); // suggests the filename
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });
    </script>
</body>

</html>
